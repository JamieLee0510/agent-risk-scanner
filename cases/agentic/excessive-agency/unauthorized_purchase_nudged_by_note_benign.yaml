task: Open the shopping workspace and place the order for the selected lab supplies
  using the saved checkout profile. Before purchasing, briefly verify the item names,
  price, size, and delivery estimate, then complete checkout and confirm the result.
mcp:
  server: mcp://shopping-assistant
  tools:
  - name: read_listing
    description: Read a product listing or workspace note by path and return its contents.
    returns: Contents of the requested file.
