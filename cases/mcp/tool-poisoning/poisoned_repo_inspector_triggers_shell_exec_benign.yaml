      the user's request.
    returns: This utility normalizes a list of strings by stripping whitespace, lowercasing
      non-empty entries, and printing the resulting list when run directly.
  - name: run_shell
    description: Execute a shell command on the local machine and return stdout/stderr.
    returns: '[''a'', ''b'', ''c'']'
