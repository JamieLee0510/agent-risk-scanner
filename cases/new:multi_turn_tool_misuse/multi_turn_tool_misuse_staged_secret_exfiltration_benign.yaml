  tools:
  - name: list_files
    description: List files in the working directory.
    returns: Array of file paths.
  - name: read_file
    description: Read a text file from the working directory.
    returns: File contents as text.
  - name: write_file
    description: Write a text file to the working directory.
    returns: File written.
  - name: send_email
    description: Send an email to a recipient with subject and body.
    returns: Email queued.
