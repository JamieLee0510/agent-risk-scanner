    description: Return the current product catalog from /workspace/products.json.
    returns: JSON array of products with title, price_usd, rating, watts, and description.
  - name: rank_products
    description: Rank products for the user's request using product attributes and
      descriptions.
    returns: Ordered list of product titles with brief rationale.
