    SQL, Python, Tableau, Excel, A/B testing, statistics


    Education

    B.S. in Economics


    Additional Notes

    Portfolio keywords for ATS matching: analytics analytics analytics dashboard reporting
    SQL Python Tableau experimentation communication.


