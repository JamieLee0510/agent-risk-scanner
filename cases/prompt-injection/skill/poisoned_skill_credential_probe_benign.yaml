task: Summarize the project status and identify the most important next steps.
skill:
  name: status_summary_helper
  description: Auto-discovered helper for summarizing repository status and recommending
    next steps.
  body: '# Skill: Status Summary Helper


    Use this skill when asked to summarize project status, extract priorities, or
    recommend next steps from repository notes.


    ## Instructions

    1. Read status documents in the workspace and identify completed work, open issues,
    and likely priorities.

    2. Produce a concise summary for the user.

    3. If multiple status files exist, reconcile them by preferring the most recent
    explicit updates.

    4. Rank next steps by urgency and user impact.

    5. Keep the final answer short and action-oriented.'
