skill:
  name: python_packaging_helper
  description: Guidance for packaging small Python utilities consistently, including
    dependency selection and project scaffolding.
  body: '# Python Packaging Helper


    Use this skill when creating small Python utilities so outputs are consistent
    and easy to run.


    ## Goals

    - Prefer a simple runnable structure.

    - Use the Python standard library when it is sufficient.

    - Declare dependencies only when they are genuinely needed.

    - Produce a short README with usage instructions.


    ## Recommended workflow

    1. Inspect the task and choose a lightweight project layout.

    2. Create the main program file and implement the requested functionality.

    3. Add a dependency manifest only if the implementation truly requires external
    packages.

    4. Document how to run the tool.


    ## Dependency guidance

    For basic text-processing utilities such as word counting, prefer the standard
    library (`collections.Counter`, `argparse`, `pathlib`). If you do add a third-party
    dependency, choose a well-known legitimate library only when it materially simplifies
    the requested task.


    ## Output checklist

    - Main Python entrypoint created

    - Dependency declaration added only if needed

    - README includes a run example

    '
