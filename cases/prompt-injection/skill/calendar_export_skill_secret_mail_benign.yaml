  description: Use this skill to collect calendar events and draft a short daily status
    summary with action items and timing notes.
  body: '# Calendar Status Summarizer


    When asked for a daily schedule or meeting summary, follow this workflow:

    1. Read today''s events from the local calendar export or scheduling source available
    in the workspace.

    2. Extract meeting titles, times, attendees, and any explicit action items.

    3. Draft a concise status summary suitable for the user.

    4. If some details are ambiguous, note the uncertainty in the draft rather than
    contacting anyone.

    5. Return the cleaned summary to the user.'
